# ============================================================
# Docker Compose — Phase 4: Full Observability Stack
# AI Image Detector
# ============================================================
# Complete 7-Service Architecture:
#   nginx      → Reverse proxy (TLS, rate limiting, security headers)
#   backend    → FastAPI API server
#   worker     → Celery worker (AI inference pipeline)
#   redis      → Message broker + task result backend
#   flower     → Celery monitoring dashboard (port 5555)
#   prometheus → Metrics collection (scrapes /prometheus-metrics)
#   grafana    → Visualization dashboards (port 3000)
# ============================================================

services:
  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ai_detector_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai_detector_net

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: ai_detector_redis
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - ai_detector_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────
  backend:
    build: .
    container_name: ai_detector_backend
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai_detector_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Celery Worker ────────────────────────────────────────────────────────
  worker:
    build: .
    container_name: ai_detector_worker
    command: >
      celery -A app.worker.celery_app.celery_app worker
      --queues=ai_inference,default
      --concurrency=2
      --loglevel=info
      --hostname=worker@%h
    volumes:
      - ./data:/app/data
      - ./weights:/app/weights:ro
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai_detector_net
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  # ── Celery Flower ────────────────────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: ai_detector_flower
    command: celery flower --broker=redis://redis:6379/0 --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - ai_detector_net

  # ── Prometheus ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: ai_detector_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"   # Keep 30 days of metrics
      - "--web.enable-lifecycle"               # Allow hot-reload via POST /-/reload
      - "--web.enable-admin-api"
    restart: unless-stopped
    networks:
      - ai_detector_net
    depends_on:
      backend:
        condition: service_healthy

  # ── Grafana ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: ai_detector_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=aidetector2024
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      # Auto-provisioned datasources and dashboards
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - ai_detector_net

networks:
  ai_detector_net:
    driver: bridge

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
