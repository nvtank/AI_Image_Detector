# ============================================================
# Nginx Reverse Proxy - Development Configuration (No SSL)
# Use this for local development without HTTPS certificates
# ============================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_inference:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream backend_pool {
    least_conn;
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Security Headers (same as production, minus HSTS)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    server_tokens off;
    limit_conn conn_limit 20;
    client_max_body_size 15m;

    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    # Backend API - General
    location ~ ^/(health|history|models|metrics|security) {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API - Auth (strict rate limit)
    location /auth {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API - AI Inference (strict rate limit)
    location ~ ^/(predict|predict-hybrid|predict-url|explain) {
        limit_req zone=api_inference burst=5 nodelay;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # Swagger docs
    location ~ ^/(docs|openapi|api/v1) {
        limit_req zone=api_general burst=10 nodelay;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
