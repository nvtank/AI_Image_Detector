# ============================================================
# Nginx Reverse Proxy - Security Hardened Configuration
# AI Image Detector - Infrastructure Thesis Project
# ============================================================
# This configuration implements Defense-in-Depth at the Gateway layer:
# - TLS 1.3 only (disabled TLS 1.0/1.1/1.2 to prevent downgrade attacks)
# - HTTP Security Headers (HSTS, CSP, X-Frame-Options, etc.)
# - Rate Limiting at Gateway level (Token Bucket via limit_req)
# - Request size limits (prevents oversized uploads)
# - Upstream load balancing (ready for horizontal scaling)
# ============================================================

# --- Rate Limiting Zones (Token Bucket algorithm) ---
# Shared memory zones for tracking client request rates

# General API rate limit: 10 requests/second per IP (burst 20)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;

# AI Inference endpoints: 3 requests/second per IP (burst 5)
# These are expensive operations (GPU inference + Gemini API calls)
limit_req_zone $binary_remote_addr zone=api_inference:10m rate=3r/s;

# Auth endpoints: 2 requests/second per IP (burst 5)
# Prevents brute-force login attacks
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;

# Connection limiting: max 20 simultaneous connections per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;


# --- Upstream Backend Servers ---
# Ready for horizontal scaling: add more backend instances here
upstream backend_pool {
    # Load balancing strategy: least connections (optimal for AI inference)
    least_conn;
    
    server backend:8000;
    # Add more backend instances for scaling:
    # server backend-2:8000;
    # server backend-3:8000;
}

upstream frontend_pool {
    server frontend:3000;
}


# --- HTTP → HTTPS Redirect ---
server {
    listen 80;
    server_name _;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}


# --- Main HTTPS Server Block ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ========================================
    # TLS Configuration - Hardened
    # ========================================
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    
    # TLS 1.3 ONLY - disable all older versions to prevent downgrade attacks
    ssl_protocols TLSv1.3;
    
    # Use server's cipher preference order
    ssl_prefer_server_ciphers on;
    
    # Strong cipher suites only
    ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256';
    
    # OCSP Stapling for faster TLS handshakes
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # SSL session caching
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ========================================
    # HTTP Security Headers
    # ========================================
    
    # Prevent Clickjacking attacks
    add_header X-Frame-Options "DENY" always;
    
    # Prevent MIME-type sniffing (XSS via content-type confusion)
    add_header X-Content-Type-Options "nosniff" always;
    
    # Enable browser XSS filter
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Force HTTPS for 2 years + subdomains + preload list
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Restrict Referer header leakage
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Restrict browser features/APIs
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' ws: wss:;" always;
    
    # Hide server version information
    server_tokens off;
    
    # Connection limit per IP
    limit_conn conn_limit 20;

    # ========================================
    # Request Size Limits
    # ========================================
    
    # Maximum upload size: 15MB (slightly above the app's 10MB limit for headers overhead)
    client_max_body_size 15m;
    
    # Timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;  # AI inference can take time

    # ========================================
    # Frontend (Next.js) - All non-API routes
    # ========================================
    location / {
        limit_req zone=api_general burst=20 nodelay;
        
        proxy_pass http://frontend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # Backend API - General endpoints
    # ========================================
    location ~ ^/(health|history|models|metrics|security) {
        limit_req zone=api_general burst=20 nodelay;
        
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # Backend API - Auth endpoints (strict rate limit)
    # ========================================
    location /auth {
        limit_req zone=api_auth burst=5 nodelay;
        
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # Backend API - AI Inference endpoints (strict rate limit)
    # These are the most expensive operations (GPU + Gemini API)
    # ========================================
    location ~ ^/(predict|predict-hybrid|predict-url|explain) {
        limit_req zone=api_inference burst=5 nodelay;
        
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extended timeout for AI inference (model loading + Gemini API call)
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # ========================================
    # Swagger/OpenAPI documentation
    # ========================================
    location ~ ^/api/v1/(openapi\.json) {
        limit_req zone=api_general burst=10 nodelay;
        
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /docs {
        limit_req zone=api_general burst=10 nodelay;
        
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ========================================
    # Block common attack paths
    # ========================================
    
    # Block access to hidden files (e.g., .env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block common exploit paths
    location ~* (wp-admin|wp-login|phpinfo|\.php$|\.asp$|\.aspx$) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
